<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-LKPD Matematika – Penjumlahan Berulang | Kelas 3 SD</title>
  <meta name="description" content="E-LKPD Matematika interaktif untuk siswa kelas 3 SD. Materi Penjumlahan Berulang (Perkalian).">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <style>
    body { background: #FDF6EC; overflow-x: hidden; margin: 0; }

    /* Warm dot pattern background */
    .bg-pattern {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-image: radial-gradient(#D9944E 1.5px, transparent 1.5px);
      background-size: 32px 32px;
      opacity: 0.1; z-index: -2;
    }

    /* Warm color blobs */
    .bg-blobs {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1; overflow: hidden; pointer-events: none;
    }
    .blob {
      position: absolute; border-radius: 50%;
      filter: blur(80px); opacity: 0.35;
      animation: blobPulse 12s ease-in-out infinite alternate;
    }
    @keyframes blobPulse {
      0%   { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.15) translate(20px, -20px); }
    }
    .blob-1 { top: -15%; left: -10%; width: 55vw; height: 55vw; background: #C17A3C; }
    .blob-2 { bottom: -15%; right: -10%; width: 45vw; height: 45vw; background: #F0A830; animation-delay: -6s; }
    .blob-3 { top: 35%; left: 55%; width: 30vw; height: 30vw; background: #E8A855; opacity: 0.2; animation-duration: 16s; }

    /* ===== LAYOUT ===== */
    .hero-container {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 1.5rem 1rem;
    }

    /* Warm glass card */
    .glass-card {
      background: rgba(253, 246, 236, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 32px;
      box-shadow: 0 24px 60px rgba(93,58,30,0.15), inset 0 0 0 1px rgba(255,255,255,0.55);
      padding: 2.5rem 2rem;
      max-width: 980px; width: 100%;
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 3rem; align-items: center;
      position: relative; overflow: hidden;
    }
    @media (max-width: 768px) {
      .glass-card { grid-template-columns: 1fr; gap: 2rem; padding: 2rem 1.5rem; border-radius: 24px; }
      .hero-image-wrapper { order: -1; }
    }
    @media (max-width: 480px) {
      .glass-card { padding: 1.5rem 1.2rem; border-radius: 20px; gap: 1.5rem; }
      .hero-container { padding: 1rem 0.75rem; }
    }

    /* ===== HERO TEXT SIDE ===== */
    .hero-text { display: flex; flex-direction: column; gap: 1.2rem; z-index: 2; }

    .badge {
      align-self: flex-start;
      background: linear-gradient(135deg, #C17A3C, #8B5A22);
      color: white; font-family: 'Fredoka One', cursive;
      font-size: 1rem; padding: 0.5rem 1.5rem;
      border-radius: 50px;
      box-shadow: 0 6px 18px rgba(193,122,60,0.4);
      animation: floatBadge 3s ease-in-out infinite; letter-spacing: 1px;
    }
    @keyframes floatBadge {
      0%,100% { transform: translateY(0) rotate(-1deg); }
      50%      { transform: translateY(-6px) rotate(1deg); }
    }

    .main-title {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(2.4rem, 5vw, 4rem);
      line-height: 1.1; color: #5C3A1E;
      margin: 0; letter-spacing: -1px;
    }
    .main-title span { color: #C17A3C; display: block; margin-top: 0.2rem; }

    .subtitle {
      font-weight: 800; color: #6B4226;
      font-size: clamp(0.9rem, 2.5vw, 1.1rem); line-height: 1.6;
    }

    /* ===== FORM ===== */
    .hero-form {
      background: #FFFBF4; padding: 1.8rem;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(93,58,30,0.1);
      border: 3px solid #F0DDB8; z-index: 2;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    @media (hover: hover) {
      .hero-form:hover { transform: translateY(-5px); box-shadow: 0 20px 45px rgba(93,58,30,0.14); }
    }
    .hero-form h3 {
      font-family: 'Fredoka One', cursive; color: #C17A3C;
      margin-bottom: 1.5rem; font-size: 1.3rem; text-align: center;
    }
    @media (max-width: 480px) {
      .hero-form { padding: 1.4rem; }
      .hero-form h3 { font-size: 1.15rem; margin-bottom: 1rem; }
    }

    /* ===== MASCOT IMAGE SIDE ===== */
    .hero-image-wrapper {
      position: relative; display: flex;
      justify-content: center; align-items: center; z-index: 1;
    }

    .mascot-img {
      width: 100%; max-width: 380px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(93,58,30,0.22);
      border: 7px solid #FFFBF4;
      transform: rotate(2deg);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: floatMascot 6s ease-in-out infinite;
    }
    @media (hover: hover) {
      .mascot-img:hover { transform: rotate(0deg) scale(1.05); box-shadow: 0 26px 55px rgba(93,58,30,0.28); }
    }
    @media (max-width: 768px) { .mascot-img { max-width: 260px; } }
    @media (max-width: 480px) { .mascot-img { max-width: 200px; border-width: 5px; } }

    @keyframes floatMascot {
      0%,100% { transform: translateY(0) rotate(2deg); }
      50%      { transform: translateY(-18px) rotate(-1deg); }
    }

    /* Floating math text inside card */
    .floating-math {
      position: absolute; font-family: 'Fredoka One', cursive;
      color: rgba(193,122,60,0.15); pointer-events: none; z-index: 0; user-select: none;
    }
    .fm-1 { top: 6%;  right: 6%;  font-size: 1.5rem; animation: floatAround 8s infinite alternate; }
    .fm-2 { bottom: 10%; left: 1%; font-size: 1.8rem; animation: floatAround 10s infinite alternate-reverse; color: rgba(240,168,48,0.2); }
    .fm-3 { top: 30%; left: 42%; font-size: 2.5rem;  color: rgba(212,137,42,0.28); animation: floatAround 12s infinite alternate; }
    .fm-4 { bottom: 4%; right: 38%; font-size: 2rem;  color: rgba(232,168,85,0.28); animation: floatAround 9s infinite alternate-reverse; }
    @media (max-width: 480px) { .floating-math { display: none; } }

    /* Cute animated stars scattered */
    .twinkle {
      position: absolute; pointer-events: none; z-index: 0;
      font-size: 1.2rem; animation: twinkleStar 3s ease-in-out infinite;
    }
    .twinkle:nth-child(odd)  { animation-delay: 1s; }
    .twinkle:nth-child(even) { animation-delay: 2s; }
    @keyframes twinkleStar {
      0%,100% { opacity: 0.2; transform: scale(0.9) rotate(0deg); }
      50%      { opacity: 0.7; transform: scale(1.2) rotate(15deg); }
    }
  </style>
</head>
<body>

<div class="bg-pattern"></div>
<div class="bg-blobs">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<main class="hero-container">
  <div class="glass-card">
    <!-- Floating math decorations -->
    <div class="floating-math fm-1">3 × 4 = 12</div>
    <div class="floating-math fm-2">2 + 2 = 4</div>
    <div class="floating-math fm-3">✨</div>
    <div class="floating-math fm-4">➕</div>
    <!-- Twinkling stars -->
    <span class="twinkle" style="top:8%;left:30%;">⭐</span>
    <span class="twinkle" style="top:70%;right:15%;">🌟</span>
    <span class="twinkle" style="bottom:12%;left:38%;">✨</span>

    <!-- LEFT: Text + Form -->
    <div class="hero-text">
      <div class="badge">🍪 Kelas 3 SD • 2026</div>
      <h1 class="main-title">E-LKPD <span>MATEMATIKA</span></h1>
      <p class="subtitle">Belajar Penjumlahan Berulang (Perkalian) jadi lebih seru, interaktif, dan menyenangkan! 🚀</p>

      <div class="hero-form">
        <h3>👋 Ayo Mulai Belajar!</h3>
        <div class="form-group">
          <label for="input-nama">✏️ Nama Siswa</label>
          <input type="text" id="input-nama" placeholder="Tulis nama kamu di sini..."
            autocomplete="off" autocapitalize="words">
        </div>
        <div class="form-group">
          <label for="input-kelas">🏫 Kelas</label>
          <input type="text" id="input-kelas" placeholder="Contoh: 3A"
            autocomplete="off" autocapitalize="characters">
        </div>
        <button class="btn-start" id="btn-start">🚀 Masuk Sekarang</button>
      </div>
    </div>

    <!-- RIGHT: Mascot Image -->
    <div class="hero-image-wrapper">
      <img src="assets/images/mascot.png" alt="Ilustrasi Kelas Matematika" class="mascot-img"
        onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\'font-size:8rem;text-align:center;animation:floatMascot 6s ease-in-out infinite;\'>🧒</div>';">
    </div>
  </div>
</main>

<!-- Cute floating helper mascot -->
<div class="helper-mascot" title="Semangat belajar! 🎉">🦉</div>

<script src="js/shared.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const savedNama  = localStorage.getItem('elkpd_nama');
    const savedKelas = localStorage.getItem('elkpd_kelas');
    if (savedNama)  document.getElementById('input-nama').value  = savedNama;
    if (savedKelas) document.getElementById('input-kelas').value = savedKelas;

    document.getElementById('btn-start').addEventListener('click', startLearning);
    ['input-nama','input-kelas'].forEach(id => {
      document.getElementById(id).addEventListener('keyup', e => {
        if (e.key === 'Enter') startLearning();
      });
    });
  });

  function startLearning() {
    const name  = document.getElementById('input-nama').value.trim();
    const kelas = document.getElementById('input-kelas').value.trim();

    if (!name || !kelas) {
      showToast('Isi nama dan kelas dulu ya! 😊', 'warning');
      const form = document.querySelector('.hero-form');
      form.style.animation = 'shake 0.4s ease';
      setTimeout(() => form.style.animation = '', 450);
      return;
    }

    localStorage.setItem('elkpd_nama',  name);
    localStorage.setItem('elkpd_kelas', kelas);

    showConfetti();
    const card = document.querySelector('.glass-card');
    card.style.transition = 'all 0.5s ease';
    card.style.transform  = 'scale(0.95)';
    card.style.opacity    = '0';
    setTimeout(() => { window.location.href = 'petunjuk.html'; }, 600);
  }
</script>
</body>
</html>
